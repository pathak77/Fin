spring:
  application:
    name: Friend-Service

  datasource:
    url: jdbc:h2:mem:friend_db
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8090

grpc:
  server:
    port: 9090
