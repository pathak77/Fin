spring:
  application:
    name : User
  datasource:
    url: jdbc:h2:mem:user_db
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8095

grpc:
  client:
    ledger-service:
      address: 'localhost'
      negotiation-type: plaintext
    friend-service:
      address: 'localhost'
      negotiation-type: plaintext
  server:
    ledger-service:
      port: 9095

    friend-service:
      port: 9085